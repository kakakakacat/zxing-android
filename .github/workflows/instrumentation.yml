name: Instrumentation tests

# The decode pipeline is checked on a real Android runtime, not just on the host JVM.
# Emulators can verify decoding, permissions, lifecycle and Intents; they cannot stand in
# for a real camera, so scan latency and recognition rates are never measured here.

on:
  push:
    branches: [ maint/android ]
  pull_request:
    branches: [ maint/android ]
  workflow_dispatch:

jobs:
  androidTest:
    name: API ${{ matrix.api }} frame decode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [ 21, 34, 35, 36 ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 35 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :scanner:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports-api${{ matrix.api }}
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore
