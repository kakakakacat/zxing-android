name: Release

# Builds the AAR and the APK for a tag, attaches them to a GitHub Release with
# checksums, and publishes the AAR to GitHub Packages.
#
# Nothing here is signed with a production key: the APK is a debug-signed build and is
# explicitly not an update to the published Barcode Scanner. See docs/maint/MIGRATION.md.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          ./gradlew :scanner:assembleRelease :app:assembleDebug \
            -PscannerVersion=${{ steps.version.outputs.value }}

      - name: Checksums
        run: |
          mkdir -p dist
          cp scanner/build/outputs/aar/scanner-release.aar \
             dist/zxing-android-scanner-${{ steps.version.outputs.value }}.aar
          cp android/build/outputs/apk/debug/app-debug.apk \
             dist/barcode-scanner-community-${{ steps.version.outputs.value }}-debug.apk
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the AAR to GitHub Packages
        run: |
          ./gradlew \
            :core:publishMavenPublicationToGitHubPackagesRepository \
            :scanner:publishReleasePublicationToGitHubPackagesRepository \
            -PscannerVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Community maintenance build of the ZXing Android client.
            Not an official ZXing release and not signed with the upstream key:
            this APK cannot update the published Barcode Scanner app.

            AAR coordinates (GitHub Packages):
            `io.github.kakakakacat.zxing:zxing-android-scanner:${{ steps.version.outputs.value }}`
