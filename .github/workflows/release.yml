name: Release

# Builds the AAR and the APK for a tag, attaches them to a GitHub Release with
# checksums, and publishes the AAR to GitHub Packages.
#
# Nothing here is signed with a production key: the APK is a debug-signed build and is
# explicitly not an update to the published Barcode Scanner. See docs/maint/MIGRATION.md.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned NDK
        run: |
          NDK_VERSION=$(grep -E '^ndk = ' gradle/libs.versions.toml | cut -d'"' -f2)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          ./gradlew :scanner:assembleRelease :app:assembleDebug \
            -PscannerVersion=${{ steps.version.outputs.value }}

      - name: Checksums
        run: |
          mkdir -p dist
          cp scanner/build/outputs/aar/scanner-release.aar \
             dist/zxing-android-scanner-${{ steps.version.outputs.value }}.aar
          cp android/build/outputs/apk/debug/app-debug.apk \
             dist/barcode-scanner-community-${{ steps.version.outputs.value }}-debug.apk
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Run before anything is pushed: once a version exists in GitHub Packages it
      # cannot be replaced, so an incomplete set is not something to discover afterwards.
      - name: The set about to be published is resolvable
        run: |
          python3 -I tools/maint/check_release_publishes.py \
            --version "${{ steps.version.outputs.value }}"

      # Both artifacts, in one step, because they are not independent: :scanner declares
      # `api(project(":core"))`, so its POM carries a compile dependency on
      # io.github.kakakakacat.zxing:zxing-core at the same version. Publishing the AAR
      # alone leaves that dependency unresolvable and every consumer's build fails.
      #
      # The comment that used to stand here said :core was withheld because its classes
      # were com.google.zxing.* and would collide with upstream. They have not been since
      # the 849921bfa rename -- avoiding that collision is why the rename happened -- and
      # the stale reasoning is what hid the broken POM. PUBLISHING.md has always
      # documented both artifacts as published.
      - name: Publish the AAR and the decoder to GitHub Packages
        run: |
          ./gradlew \
            :core:publishMavenPublicationToGitHubPackagesRepository \
            :scanner:publishReleasePublicationToGitHubPackagesRepository \
            -PscannerVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release notes live in CHANGELOG.md; the Release quotes that section rather
      # than keeping a second copy that can drift from it.
      - name: Extract the release notes for this version
        id: notes
        run: |
          python3 tools/maint/changelog_section.py \
            --version "${{ steps.version.outputs.value }}" \
            --changelog CHANGELOG.md > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.aar
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
