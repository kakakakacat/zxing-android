name: ROI language experiment correctness
on:
  push:
    branches: [ maint/android ]
    paths:
      - 'benchmark/native-roi/**'
      - '.github/workflows/roi-language-experiment.yml'
  pull_request:
    paths:
      - 'benchmark/native-roi/**'
      - '.github/workflows/roi-language-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up isolated experiment compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-17
          rustup toolchain install 1.75.0 --profile minimal
          rustup override set 1.75.0
      - name: Protocol tests
        run: python3 -m unittest discover -s benchmark/native-roi -p 'test_*.py'
      - name: C++ Rust Java and JNI correctness only
        run: CXX=clang++-17 python3 benchmark/native-roi/run.py --verify-only
