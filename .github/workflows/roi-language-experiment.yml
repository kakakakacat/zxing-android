name: ROI language experiment correctness
on:
  push:
    branches: [ maint/android ]
    paths:
      - 'benchmark/native-roi/**'
      - '.github/workflows/roi-language-experiment.yml'
  pull_request:
    paths:
      - 'benchmark/native-roi/**'
      - '.github/workflows/roi-language-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Protocol tests
        run: python3 -m unittest discover -s benchmark/native-roi -p 'test_*.py'
      - name: Android report protocol tests
        run: python3 -m unittest discover -s benchmark/tools -p 'test_roi_android_report.py'
      - name: Java C++ and JNI correctness only
        run: python3 benchmark/native-roi/run.py --verify-only
