name: Build

on:
  push:
    branches: [ maint/android, master ]
  pull_request:
    branches: [ maint/android, master ]

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # zxing-cpp is a submodule pinned to a release tag. Without this the native
          # build fails at CMake configure time with a message saying exactly that.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the scanner AAR
        run: ./gradlew :scanner:assembleRelease

      - name: ABI packaging checker tests
        run: python3 tools/maint/test_check_abi_aars.py

      - name: Publish all AAR classifiers locally and verify consumer resolution
        run: |
          ./gradlew :core:publishMavenPublicationToMavenLocal :scanner:publishMavenPublicationToMavenLocal \
            -PscannerVersion=0.0.0-abicheck
          ./gradlew -p tools/maint/abi-consumer verifyAbiDependency \
            -PscannerVersion=0.0.0-abicheck -PscannerAbi=arm64-v8a
          ./gradlew -p tools/maint/abi-consumer verifyAbiDependency \
            -PscannerVersion=0.0.0-abicheck -PscannerAbi=armeabi-v7a

      - name: Assemble the app
        run: ./gradlew :app:assembleDebug

      - name: Core unit tests
        run: ./gradlew :core:test

      - name: Rebuild the dataset manifest and check it is up to date
        run: |
          python3 -I benchmark/dataset/build_manifest.py
          git diff --exit-code benchmark/dataset/manifest.json

      - name: Scanner unit tests (coordinate mapping, luma plane, decoder seam)
        run: ./gradlew :scanner:testDebugUnitTest

      - name: Integration API stays source-compatible with Java
        # The module is Kotlin; its consumers are Java. The test is written in Java and
        # most of it only has to compile. See the class comment in
        # JavaSourceCompatibilityTest.
        run: ./gradlew :android-integration:testDebugUnitTest

      - name: Install the pinned NDK
        # Pinned in gradle/libs.versions.toml. The runner ships some NDK, but not
        # necessarily this one, and "whichever NDK the runner had" is not a thing a
        # decoder comparison can hold constant.
        run: |
          NDK_VERSION=$(grep -E '^ndk = ' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "installing NDK $NDK_VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: L1 classification rules
        # How a decode is scored against its expectation decides every number in an L1
        # result file. One of these rules was wrong once; see BENCHMARKS.md §9.
        run: ./gradlew :benchmark-corpus:test

      - name: Benchmark frame generator and goldens (L2, host side)
        # The generated replay frames are the comparability key for every L2 result
        # (BENCHMARKS.md §10.4). If a change moves a single pixel, this fails here,
        # before anyone reaches a device and takes a number that cannot be compared.
        run: ./gradlew :benchmark-android:testReleaseUnitTest

      - name: Benchmark tooling tests (report converter and comparison gates)
        run: |
          python3 -I benchmark/tools/test_l2_report.py
          python3 -I benchmark/tools/test_compare.py
          python3 -I benchmark/tools/test_noise_floor.py
          python3 -I benchmark/tools/test_l1_compare.py
          python3 -I benchmark/tools/test_l3_report.py
          python3 -I benchmark/tools/test_l4_report.py
          python3 -I benchmark/tools/test_ci_compare.py

      - name: Assemble the L2 benchmark APK
        # Not run here — a shared CI runner cannot produce a timing worth keeping. This
        # only proves the benchmark still builds against the current frame path.
        run: ./gradlew :benchmark-android:assembleReleaseAndroidTest

      - name: Assemble the camera-backend spike (all three flavors)
        # Phase 6's evidence lives in this module (docs/maint/decisions/0001-camera-backend.md).
        # Nothing ships from it and CI cannot run it -- it needs a camera -- but a spike that
        # stops compiling is a spike nobody can re-run, and the measurements in that record
        # are only worth what reproducing them is worth.
        run: |
          ./gradlew :camera-spike:assembleCamera1Release \
                    :camera-spike:assembleCameraxRelease \
                    :camera-spike:assembleCameraxleanRelease

      - name: Assemble the L3 macrobenchmark
        # Not run here either, and for a stronger reason than L2's: L3 measures a camera,
        # and a CI runner has none. The script refuses an emulator outright. This proves
        # the harness still builds against the app it drives -- including the `benchmark`
        # build type and the trace markers in :scanner it reads.
        run: ./gradlew :benchmark-l3:assembleBenchmark :app:assembleBenchmark

      - name: No private note was committed in plaintext
        # docs/maint/private/ carries hostnames and command lines for a device this public
        # repository must not name. The plaintext is git-ignored; this is the second line,
        # because an ignore rule only helps someone who does not pass -f. Watched failing
        # on purpose before it was committed.
        run: tools/maint/private.sh check

      - name: A release would publish a resolvable POM
        # :scanner's POM depends on this project's own :core. Publishing one without the
        # other produces an artifact no consumer can resolve, and that is exactly what
        # release.yml did for as long as nobody read the POM. Checked here because it
        # costs a POM generation, and because the alternative is finding out at a tag.
        run: python3 -I tools/maint/check_release_publishes.py

      - name: Release verification gate tests
        run: python3 tools/maint/test_release_gate.py

      - name: Lint
        run: ./gradlew :scanner:lintRelease :app:lintDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            scanner/build/outputs/aar/*.aar
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
