# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
# ******** NOTE ********

name: "CodeQL"

on:
  # `master` is untouched upstream in this fork; all work lands on `maint/android`,
  # so the inherited `[ master ]` filters meant this never ran on a push at all --
  # only the weekly schedule, against the default branch.
  push:
    branches: [ maint/android ]
  schedule:
    - cron: '42 6 * * 1'
  workflow_dispatch:

# The repository's default GITHUB_TOKEN is read-only, and this workflow inherited no
# `permissions` block, so `analyze` finished the scan and then failed uploading it:
# "Resource not accessible by integration". `security-events: write` is what that upload
# needs; the other two are the read scopes the action uses, named so the token stays
# minimal rather than falling back to the default set.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # Autobuild runs ./gradlew cold, so the wrapper fetches the Gradle distribution
    # itself -- behind CodeQL's dependency proxy, on a 10 s timeout, on every run. That
    # failed twice in a row on 2026-11-09 ("Downloading from
    # https://services.gradle.org/distributions/gradle-9.7.1-bin.zip failed: timeout")
    # while Build stayed green, because Build provisions Gradle first. Doing the same
    # here takes the download off autobuild's critical path and shares its cache.
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
