# Pinned toolchain for the Android maintenance fork. See docs/maint/HANDOFF.md.
[versions]
# Kotlin is not listed here on purpose: AGP 9 compiles Kotlin itself, and the version
# comes with AGP (9.4.1 -> Kotlin 2.2.10). Declaring the Kotlin Gradle plugin on top of
# that fails outright -- "extension 'kotlin' already registered". See docs/maint/HANDOFF.md.
agp = "9.4.1"
ndk = "29.0.14206865"
junit = "4.13.2"
androidxCore = "1.13.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.2.1"
androidxBenchmark = "1.5.0"
androidxLifecycle = "2.8.7"
# Publishes to Maven Central's Portal API. Plain `maven-publish` cannot: the Portal takes
# a signed bundle upload, not a repository deploy. See docs/maint/PUBLISHING.md.
mavenPublish = "0.37.0"
# The CameraX line :scanner ships against, Phase 6's adoption. Current stable; minSdk 23,
# which is this project's floor since `2e9e5ce16`.
camerax = "1.6.2"
# What the Phase 6 spike is built against, and it stays there on purpose: every number in
# docs/maint/decisions/0001-camera-backend.md was measured on 1.4.2, and a version bump
# under the spike would quietly detach those numbers from the code that produced them.
# 1.4.2 is also the last line that supported minSdk 21, which the spike predates.
cameraxSpike = "1.4.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "androidxBenchmark" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidxLifecycle" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
# The spike's three, pinned to the version its recorded measurements were taken on.
# camera-view exists only there: the shipping library deliberately does not take it.
camerax-spike-core = { module = "androidx.camera:camera-core", version.ref = "cameraxSpike" }
camerax-spike-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraxSpike" }
camerax-spike-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraxSpike" }
camerax-spike-view = { module = "androidx.camera:camera-view", version.ref = "cameraxSpike" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# L3 only: a Macrobenchmark module drives another app rather than being one.
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-benchmark = { id = "androidx.benchmark", version.ref = "androidxBenchmark" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
