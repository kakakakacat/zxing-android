<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="title desc">
<title id="title">ZXing Java 与原生解码器：Android 帧链路性能测试</title>
<desc id="desc">来自提交 602d368c4 的九个默认全码制场景。原生后端在无码和二维码命中时更快，Java 在居中一维码命中时更快。各面板采用不同量程、从零开始的线性毫秒刻度。单台 Android 14 设备、锁频；不是整应用与上游的对比。</desc>
<rect width="1100" height="1320" rx="22" fill="#f5f7fb"/>
<g font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#18243b">
<text x="40" y="51" font-size="28" font-weight="700">ZXing Java 与原生解码性能对比</text>
<text x="40" y="82" font-size="17" fill="#526077">Android 帧处理链路 · 每帧耗时中位数 · 越低越好</text>
<rect x="40" y="107" width="17" height="17" rx="3" fill="#64748b"/><text x="67" y="122" font-size="16">Java ZXing 后端</text>
<rect x="310" y="107" width="17" height="17" rx="3" fill="#2563eb"/><text x="337" y="122" font-size="16">本分支：zxing-cpp 后端</text>
<rect x="24" y="150" width="1052" height="326" rx="14" fill="#ffffff" stroke="#e1e7f0"/>
<text x="44" y="184" font-size="22" font-weight="700">未识别到条码</text>
<text x="44" y="210" font-size="16" fill="#526077">这些测试帧中，原生后端耗时降低 77–81%。</text><line x1="300" y1="229" x2="300" y2="426" stroke="#e7ecf3"/><text x="300" y="454" text-anchor="middle" font-size="14" fill="#64748b">0</text><line x1="470" y1="229" x2="470" y2="426" stroke="#e7ecf3"/><text x="470" y="454" text-anchor="middle" font-size="14" fill="#64748b">30</text><line x1="640" y1="229" x2="640" y2="426" stroke="#e7ecf3"/><text x="640" y="454" text-anchor="middle" font-size="14" fill="#64748b">60</text><line x1="810" y1="229" x2="810" y2="426" stroke="#e7ecf3"/><text x="810" y="454" text-anchor="middle" font-size="14" fill="#64748b">90</text><text x="843" y="454" font-size="14" fill="#64748b">ms</text><text x="1036" y="238" text-anchor="end" font-size="13" fill="#64748b">原生后端耗时变化</text><text x="44" y="275" font-size="17" font-weight="600">640 × 480</text><rect x="300" y="255" width="123.145" height="17" rx="3" fill="#64748b"/><text x="432.14" y="269" font-size="14" fill="#64748b">21.731</text><rect x="300" y="278" width="23.457" height="17" rx="3" fill="#2563eb"/><text x="332.46" y="292" font-size="14" fill="#2563eb">4.139</text><text x="1036" y="279" text-anchor="end" font-size="20" font-weight="700" fill="#087f5b">-81.0%</text><text x="44" y="337" font-size="17" font-weight="600">1280 × 720</text><rect x="300" y="317" width="274.420" height="17" rx="3" fill="#64748b"/><text x="583.42" y="331" font-size="14" fill="#64748b">48.427</text><rect x="300" y="340" width="59.262" height="17" rx="3" fill="#2563eb"/><text x="368.26" y="354" font-size="14" fill="#2563eb">10.458</text><text x="1036" y="341" text-anchor="end" font-size="20" font-weight="700" fill="#087f5b">-78.4%</text><text x="44" y="399" font-size="17" font-weight="600">1920 × 1080</text><rect x="300" y="379" width="460.868" height="17" rx="3" fill="#64748b"/><text x="769.87" y="393" font-size="14" fill="#64748b">81.330</text><rect x="300" y="402" width="105.837" height="17" rx="3" fill="#2563eb"/><text x="414.84" y="416" font-size="14" fill="#2563eb">18.677</text><text x="1036" y="403" text-anchor="end" font-size="20" font-weight="700" fill="#087f5b">-77.0%</text><rect x="24" y="494" width="1052" height="326" rx="14" fill="#ffffff" stroke="#e1e7f0"/>
<text x="44" y="528" font-size="22" font-weight="700">二维码命中</text>
<text x="44" y="554" font-size="16" fill="#526077">这些测试帧中，原生后端耗时降低 71.9–82.5%。</text><line x1="300" y1="573" x2="300" y2="770" stroke="#e7ecf3"/><text x="300" y="798" text-anchor="middle" font-size="14" fill="#64748b">0</text><line x1="470" y1="573" x2="470" y2="770" stroke="#e7ecf3"/><text x="470" y="798" text-anchor="middle" font-size="14" fill="#64748b">12</text><line x1="640" y1="573" x2="640" y2="770" stroke="#e7ecf3"/><text x="640" y="798" text-anchor="middle" font-size="14" fill="#64748b">24</text><line x1="810" y1="573" x2="810" y2="770" stroke="#e7ecf3"/><text x="810" y="798" text-anchor="middle" font-size="14" fill="#64748b">36</text><text x="843" y="798" font-size="14" fill="#64748b">ms</text><text x="1036" y="582" text-anchor="end" font-size="13" fill="#64748b">原生后端耗时变化</text><text x="44" y="619" font-size="17" font-weight="600">640 × 480</text><rect x="300" y="599" width="130.032" height="17" rx="3" fill="#64748b"/><text x="439.03" y="613" font-size="14" fill="#64748b">9.179</text><rect x="300" y="622" width="22.807" height="17" rx="3" fill="#2563eb"/><text x="331.81" y="636" font-size="14" fill="#2563eb">1.610</text><text x="1036" y="623" text-anchor="end" font-size="20" font-weight="700" fill="#087f5b">-82.5%</text><text x="44" y="681" font-size="17" font-weight="600">1280 × 720</text><rect x="300" y="661" width="255.606" height="17" rx="3" fill="#64748b"/><text x="564.61" y="675" font-size="14" fill="#64748b">18.043</text><rect x="300" y="684" width="58.827" height="17" rx="3" fill="#2563eb"/><text x="367.83" y="698" font-size="14" fill="#2563eb">4.153</text><text x="1036" y="685" text-anchor="end" font-size="20" font-weight="700" fill="#087f5b">-77.0%</text><text x="44" y="743" font-size="17" font-weight="600">1920 × 1080</text><rect x="300" y="723" width="447.533" height="17" rx="3" fill="#64748b"/><text x="756.53" y="737" font-size="14" fill="#64748b">31.591</text><rect x="300" y="746" width="125.650" height="17" rx="3" fill="#2563eb"/><text x="434.65" y="760" font-size="14" fill="#2563eb">8.869</text><text x="1036" y="747" text-anchor="end" font-size="20" font-weight="700" fill="#087f5b">-71.9%</text><rect x="24" y="838" width="1052" height="326" rx="14" fill="#ffffff" stroke="#e1e7f0"/>
<text x="44" y="872" font-size="22" font-weight="700">居中一维码命中</text>
<text x="44" y="898" font-size="16" fill="#526077">权衡：此处 Java 更快；原生后端增加 0.31–1.72 ms。</text><line x1="300" y1="917" x2="300" y2="1114" stroke="#e7ecf3"/><text x="300" y="1142" text-anchor="middle" font-size="14" fill="#64748b">0.0</text><line x1="470" y1="917" x2="470" y2="1114" stroke="#e7ecf3"/><text x="470" y="1142" text-anchor="middle" font-size="14" fill="#64748b">0.7</text><line x1="640" y1="917" x2="640" y2="1114" stroke="#e7ecf3"/><text x="640" y="1142" text-anchor="middle" font-size="14" fill="#64748b">1.4</text><line x1="810" y1="917" x2="810" y2="1114" stroke="#e7ecf3"/><text x="810" y="1142" text-anchor="middle" font-size="14" fill="#64748b">2.1</text><text x="843" y="1142" font-size="14" fill="#64748b">ms</text><text x="1036" y="926" text-anchor="end" font-size="13" fill="#64748b">原生后端耗时变化</text><text x="44" y="963" font-size="17" font-weight="600">640 × 480</text><rect x="300" y="943" width="16.013" height="17" rx="3" fill="#64748b"/><text x="325.01" y="957" font-size="14" fill="#64748b">0.066</text><rect x="300" y="966" width="90.432" height="17" rx="3" fill="#2563eb"/><text x="399.43" y="980" font-size="14" fill="#2563eb">0.372</text><text x="1036" y="967" text-anchor="end" font-size="20" font-weight="700" fill="#b45309">+464.8%</text><text x="44" y="1025" font-size="17" font-weight="600">1280 × 720</text><rect x="300" y="1005" width="18.658" height="17" rx="3" fill="#64748b"/><text x="327.66" y="1019" font-size="14" fill="#64748b">0.077</text><rect x="300" y="1028" width="202.992" height="17" rx="3" fill="#2563eb"/><text x="511.99" y="1042" font-size="14" fill="#2563eb">0.836</text><text x="1036" y="1029" text-anchor="end" font-size="20" font-weight="700" fill="#b45309">+988.0%</text><text x="44" y="1087" font-size="17" font-weight="600">1920 × 1080</text><rect x="300" y="1067" width="22.103" height="17" rx="3" fill="#64748b"/><text x="331.10" y="1081" font-size="14" fill="#64748b">0.091</text><rect x="300" y="1090" width="439.727" height="17" rx="3" fill="#2563eb"/><text x="748.73" y="1104" font-size="14" fill="#2563eb">1.811</text><text x="1036" y="1091" text-anchor="end" font-size="20" font-weight="700" fill="#b45309">+1889.4%</text><text x="40" y="1213" font-size="15" font-weight="700">范围：本分支内部后端 A/B，并非原版 Barcode Scanner 与当前应用的整体对比。</text>
<text x="40" y="1238" font-size="14" fill="#526077">DN-ENG41 · Android 14 · 锁频 · 长期偏热的测试状态 · 全码制</text>
<text x="40" y="1261" font-size="14" fill="#526077">匹配处理选项 · 清晰生成帧 · 每后端一轮 · 各面板量程不同</text>
