<text x="40" y="82" font-size="17" fill="#526077">Android frame pipeline · Median time per frame · Lower is better</text>
<rect x="40" y="107" width="17" height="17" rx="3" fill="#64748b"/><text x="67" y="122" font-size="16">Java ZXing backend</text>
<rect x="310" y="107" width="17" height="17" rx="3" fill="#2563eb"/><text x="337" y="122" font-size="16">This fork: zxing-cpp backend</text>
