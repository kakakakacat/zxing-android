<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="title desc">
<title id="title">ZXing Java versus native decoder: Android frame-pipeline benchmark</title>
<desc id="desc">Nine default all-format cases from commit 099d1153a. Native is faster on misses and QR hits; Java is faster on centered one-dimensional hits. Each panel has its own zero-based linear millisecond scale. One Android 14 device, locked clocks; not a whole-app upstream comparison.</desc>
